<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Calculadora</h1>
    <h3 style="display: inline;" id="ad">Resultado:</h3>
    <h3 style="display: inline;" id="res"></h3><br>
    
    <input type="number" name="num1" id="num1">
    <input type="number" name="num2" id="num2">
    <input type="button" value="+" id="BTNsoma" onclick="somar()">
    <input type="button" value="-" id="BTNsub" onclick="subtrair()">
    <input type="button" value="x" id="BTNmul" onclick="multiplicar()">
    <input type="button" value="%" id="BTNdiv" onclick="dividir()">

    <script>
        function somar(){
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var soma = n1 + n2;

            document.getElementById("res").innerText = soma;
        }

        function subtrair(){
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var resultado = n1 - n2;
            document.getElementById("res").innerText = resultado;
        }

        function multiplicar(){
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var resultado = n1 * n2;
            document.getElementById("res").innerText = resultado;
        }

        function dividir(){
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var resultado = n2 !== 0 ? (n1 / n2) : "Erro";
            document.getElementById("res").innerText = resultado;
        }
    </script>
</body>
</html>
