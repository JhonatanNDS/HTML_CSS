<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
            border-collapse: collapse;
        }
        caption{
            font-size: 1.3em;
            font-weight: bold;
            padding: 10px;
        }
        th, td{
            border: 1px solid black;
            padding: 10px;
        }
        .destaque{
            background-color: yellow;
        }
        .cnome{
            background-color: yellow;
        }
        
    </style>
</head>
<body>
    <h1>Exercicio de tabelas</h1>
    <table>
        <colgroup>
            <col class="cnome">
            <col class="csexo">
            <col class="cidade">
            <col class="cprof">
        </colgroup>
        <caption>Cadastro</caption>
        <tr>
            <th scope="col">Nome</th>
            <th scope="col">Sexo</th>
            <th scope="col">Idade</th>
            <th scope="col">Profiçao</th>
        </tr>
        <tr>
            <td>Ana maria</td>
            <td>Feminino</td>
            <td>25</td>
            <td>Jornalista</td>
        </tr>
        <tr>
            <td>joao Paulo</td>
            <td>Masculino</td>
            <td>37</td>
            <td>Escritor</td>
        </tr>
        <tr>
            <td>Fernando Afonso</td>
            <td>Mssculino</td>
            <td>22</td>
            <td>Academico</td>
        </tr>
        <tr>
            <td>Julia Souza</td>
            <td>Feminino</td>
            <td>27</td>
            <td>juiza</td>
        </tr>
    </table>
</body>
</html>
