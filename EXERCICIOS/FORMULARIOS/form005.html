<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
    <h1>Exemplo de Formulario</h1>
    <form action="cadastro.php" method="get" autocomplete="on">
        <fieldset>
            <legend>Sexo</legend>
            <input type="radio" name="sexo" id="isxmas" value="M"> <label for="isxmas">Masculino</label>
            <input type="radio" name="sexo" id="isxfen" value="F"> <label for="isxfen">Feminino</label>
        </fieldset>
        <fieldset>
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="ebas" id="ibas"> <label for="ibas">Basquete</label> <br>
            <input type="checkbox" name="efut" id="ifut" checked> <label for="ifut">Futebol</label> <br>
            <input type="checkbox" name="enat" id="inat"> <label for="inat">Nataçao</label> <br>
            <input type="checkbox" name="eten" id="iten"> <label for="iten">Tênis</label> <br>
        </fieldset>
        
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>
    </form>
</body>
</html>
